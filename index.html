<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CI/CD Demo</title>
<style>
  /* ✏️ EDIT THESE, commit, push, and watch Jenkins redeploy the page */
  :root {
    --accent: #1f6feb;      /* change this color to see a visible change */
    --bg: #f5f7fa;
    --ink: #14181f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  main { width: 100%; max-width: 560px; }
  .banner { height: 10px; background: var(--accent); border-radius: 5px; margin-bottom: 28px; }
  h1 { font-size: 1.6rem; margin: 0 0 6px; }
  p.sub { margin: 0 0 28px; color: #5b6573; }
  .build { font-size: 5rem; font-weight: 700; line-height: 1; color: var(--accent); margin: 0 0 4px; }
  .label { color: #5b6573; margin-bottom: 28px; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 10px 20px; margin: 0; }
  dt { color: #5b6573; }
  dd { margin: 0; font-family: ui-monospace, Menlo, Consolas, monospace; word-break: break-all; }
  .status { display: inline-flex; align-items: center; gap: 8px; margin-top: 28px; font-weight: 600; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #2da44e; }
  .status.err .dot { background: #cf222e; }
</style>
</head>
<body>
<main>
  <div class="banner"></div>
  <h1>Hello from the CI/CD pipeline</h1>
  <p class="sub">Version 1: first deploy. Edit this text, push, and refresh.</p>

  <div class="build" id="build">#?</div>
  <div class="label">Jenkins build number</div>

  <dl>
    <dt>Commit</dt>      <dd id="commit">loading…</dd>
    <dt>Branch</dt>      <dd id="branch">loading…</dd>
    <dt>Built at</dt>    <dd id="built">loading…</dd>
    <dt>Container</dt>   <dd id="host">loading…</dd>
  </dl>

  <div class="status" id="status"><span class="dot"></span><span id="statusText">Checking build info…</span></div>
</main>

<script>
  fetch('/build-info.json', { cache: 'no-store' })
    .then(r => r.json())
    .then(d => {
      document.getElementById('build').textContent = '#' + d.build;
      document.getElementById('commit').textContent = d.commit;
      document.getElementById('branch').textContent = d.branch;
      document.getElementById('built').textContent = d.builtAt;
      document.getElementById('host').textContent = location.host;
      document.getElementById('statusText').textContent = 'Deployed by Jenkins';
    })
    .catch(() => {
      const s = document.getElementById('status');
      s.classList.add('err');
      document.getElementById('statusText').textContent = 'build-info.json not found (running outside the pipeline?)';
    });
</script>
</body>
</html>
